name: github-actions-test
on:
  push:
    branches:
      - main

jobs:
  My-Deploy-Job:
    runs-on: ubuntu-latest

    steps:
      - name : Hello World 출력
        run : echo "Hello World"

      - name : 여러 명령어 문장 출력하기
        run : |
          echo "Good"
          echo "Morning"

      - name : Github Actions 자체에 저장되어있는 변수를 사용
        run : |
          echo $GITHUB_SHA
          echo $GITHUB_REPOSITORY

      - name : 노출이 되면 안되는 값 출력
        run : |
          echo ${{ secrets.MY_NAME }}
          echo ${{ secrets.MY_HOBBY }}